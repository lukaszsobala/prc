name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential

    - name: Configure
      run: ./configure

    - name: Build
      run: make

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: prc-binaries
        path: |
          prc
          convert_to_prc
        retention-days: 7

    - name: Test clean
      run: make clean